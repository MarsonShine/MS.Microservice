name: dotnet-ci

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Validate build layout
        shell: pwsh
        run: ./build/validate-build-layout.ps1

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal

      - name: Publish Web
        run: dotnet publish samples/Reference/MS.Microservice.Reference.Web/MS.Microservice.Reference.Web.csproj --no-build -c Release -o artifacts/publish/web

      - name: Messaging crash recovery integration tests
        env:
          RUN_MESSAGING_INTEGRATION_TESTS: "true"
        run: dotnet test test/MS.Microservice.Messaging.IntegrationTests/MS.Microservice.Messaging.IntegrationTests.csproj --no-build -c Release --verbosity normal

      - name: Build and smoke test container
        shell: pwsh
        run: ./build/container-smoke-test.ps1

      - name: Vulnerable Packages
        run: dotnet list package --vulnerable --include-transitive
