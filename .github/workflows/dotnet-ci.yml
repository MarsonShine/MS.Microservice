name: dotnet-ci

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  core-aot:
    name: Core AOT (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            rid: win-x64
          - os: ubuntu-24.04
            rid: linux-x64
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Linux native prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang zlib1g-dev

      - name: Test static analysis checks
        run: ./build/test-validate-static-aot.ps1

      - name: Analyze Core
        run: ./build/validate-static-aot.ps1 -Project src/MS.Microservice.Core/MS.Microservice.Core.csproj

      - name: Test Core
        run: dotnet test test/MS.Microservice.Core.Tests/MS.Microservice.Core.Tests.csproj -c Release --logger "trx;LogFileName=core.trx" --results-directory artifacts/aot/tests

      - name: Test metadata and shared consumer scenarios
        run: dotnet test test/MS.Microservice.Aot.Tests/MS.Microservice.Aot.Tests.csproj -c Release --logger "trx;LogFileName=aot.trx" --results-directory artifacts/aot/tests

      - name: Publish and run native consumer
        run: ./build/validate-core-native-aot.ps1 -RuntimeIdentifier ${{ matrix.rid }} -Mode All

      - name: Upload Core validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-aot-${{ matrix.rid }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            artifacts/aot/MS.Microservice.Core/*.log
            artifacts/aot/MS.Microservice.Core/results.json
            artifacts/aot/Core.Native/**/publish.log
            artifacts/aot/Core.Native/**/run.log
            artifacts/aot/Core.Native/**/results.json
            artifacts/aot/tests/*.trx

  build-test-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Validate build layout
        shell: pwsh
        run: ./build/validate-build-layout.ps1

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal

      - name: Publish Web
        run: dotnet publish samples/Reference/MS.Microservice.Reference.Web/MS.Microservice.Reference.Web.csproj --no-build -c Release -o artifacts/publish/web

      - name: Messaging crash recovery integration tests
        env:
          RUN_MESSAGING_INTEGRATION_TESTS: "true"
        run: dotnet test MS.Microservice.Messaging/test/MS.Microservice.Messaging.IntegrationTests/MS.Microservice.Messaging.IntegrationTests.csproj --no-build -c Release --verbosity normal

      - name: Build and smoke test container
        shell: pwsh
        run: ./build/container-smoke-test.ps1

      - name: Vulnerable Packages
        run: dotnet list package --vulnerable --include-transitive
