<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 160" width="760" height="160" role="img" aria-labelledby="title">
  <title id="title">同一组候选死信，两种查询读入的字段</title>
  <rect width="760" height="160" rx="8" fill="#f6f9fc"/>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif" fill="#17384c" font-size="15">
    <rect x="18" y="41" width="162" height="78" rx="6" fill="#dde8f3"/>
    <text x="53" y="72">Outbox 32 条</text><text x="53" y="98">Inbox 32 条</text>
    <rect x="232" y="16" width="274" height="50" rx="6" fill="#f7e6ce"/>
    <text x="246" y="47">旧查询：64 个实体，含 8 MiB 正文</text>
    <rect x="232" y="94" width="274" height="50" rx="6" fill="#d9eee4"/>
    <text x="246" y="125">新查询：64 份摘要字段</text>
    <rect x="570" y="41" width="171" height="78" rx="6" fill="#e2ecf3"/>
    <text x="587" y="72">合并并按时间排序</text><text x="587" y="98">返回 32 条</text>
  </g>
  <g fill="none" stroke="#526879" stroke-width="2">
    <path d="M180 63L228 41"/><path d="M180 97L228 119"/><path d="M506 41L565 63"/><path d="M506 119L565 97"/>
  </g>
  <path d="m228 41 -6 7 -3 -6z M228 119l-9 -1 3 -6z M565 63l-9 1 2 -6z M565 97l-7 6 -2 -6z" fill="#526879"/>
</svg>
