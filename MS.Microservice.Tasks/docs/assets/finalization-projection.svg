<svg xmlns="http://www.w3.org/2000/svg" width="740" height="148" viewBox="0 0 740 148" role="img" aria-labelledby="title description">
  <title id="title">FinishAsync 终态事务</title>
  <desc id="description">Jobs 按执行令牌更新。读取五列同步执行历史，另外两列用来判断是否允许恢复重排。</desc>
  <rect x="1" y="1" width="738" height="146" rx="10" fill="#f7f9fc" stroke="#bccbd9"/>
  <g font-family="Microsoft YaHei, Segoe UI, sans-serif" fill="#172b40">
    <text x="18" y="28" font-size="16" font-weight="600">FinishAsync · 同一数据库事务</text>
    <rect x="16" y="48" width="190" height="76" rx="6" fill="#ffffff" stroke="#91a4b8"/>
    <text x="28" y="78" font-size="16">UPDATE Jobs</text>
    <text x="28" y="103" font-size="14">据取消标记写入终态</text>
    <rect x="254" y="48" width="231" height="76" rx="6" fill="#e0f0ed" stroke="#39766b"/>
    <text x="266" y="78" font-size="16">SELECT · 7 列</text>
    <text x="266" y="103" font-size="14">5 列同步历史，2 列判断重排</text>
    <rect x="532" y="48" width="192" height="76" rx="6" fill="#ffffff" stroke="#91a4b8"/>
    <text x="544" y="78" font-size="16">UPDATE JobAttempts</text>
    <text x="544" y="103" font-size="14">只写当前 Token 的历史</text>
  </g>
  <path d="M212 86H246 M239 81L246 86L239 91 M491 86H524 M517 81L524 86L517 91" fill="none" stroke="#435970" stroke-width="2"/>
</svg>
