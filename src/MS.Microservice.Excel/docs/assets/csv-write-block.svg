<svg xmlns="http://www.w3.org/2000/svg" width="900" height="445" viewBox="0 0 900 445" role="img" aria-labelledby="title description">
  <title id="title">1024 行 x，各自在什么时候交给 StreamWriter？</title>
  <desc id="description">每行 x 加 CRLF 占三个 UTF-16 代码单元。逐行提交时，调用 StreamWriter.WriteAsync 1024 次。跨行暂存时，3072 个字符占 4096 容量的四分之三，末尾只需一次调用。两条路径都由 StreamWriter 编码后写入目标流。</desc>
  <style>
    text { font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif; fill:#183b46 }
    .title { font-size:24px; font-weight:700 }
    .label { font-size:18px; font-weight:650 }
    .body { font-size:16px }
    .code { font:17px Consolas,"Microsoft YaHei",monospace }
  </style>
  <rect width="900" height="445" rx="14" fill="#f8faf9"/>
  <text x="28" y="39" class="title">1024 条短记录，哪一步少了 1023 次调用？</text>
  <text x="28" y="70" class="body">输入为同一个字段 x，默认行结束符为 CRLF。每行占用 3 个 UTF-16 字符位置。</text>

  <text x="28" y="112" class="label">逐行交给 StreamWriter</text>
  <g fill="#e1ebf4">
    <rect x="28" y="127" width="148" height="45" rx="6"/>
    <rect x="185" y="127" width="148" height="45" rx="6"/>
    <rect x="378" y="127" width="148" height="45" rx="6"/>
  </g>
  <g class="code" text-anchor="middle">
    <text x="102" y="156">x\r\n</text>
    <text x="259" y="156">x\r\n</text>
    <text x="356" y="156">…</text>
    <text x="452" y="156">x\r\n</text>
  </g>
  <g class="body" text-anchor="middle">
    <text x="102" y="196">第 1 行</text>
    <text x="259" y="196">第 2 行</text>
    <text x="452" y="196">第 1024 行</text>
  </g>
  <text x="566" y="156" class="label">WriteAsync × 1024</text>
  <text x="566" y="185" class="body">每次交出 3 个字符</text>
  <path d="M28 215H872" stroke="#c7d6d7"/>

  <text x="28" y="248" class="label">在 4096 个位置里跨行累积</text>
  <rect x="28" y="265" width="500" height="44" rx="5" fill="#e3e9e9"/>
  <path d="M33 265H403V309H33Q28 309 28 304V270Q28 265 33 265Z" fill="#bce5d4"/>
  <text x="215" y="293" class="body" text-anchor="middle">已用 3072</text>
  <text x="466" y="293" class="body" text-anchor="middle">可用 1024</text>
  <text x="566" y="286" class="label">WriteAsync × 1</text>
  <text x="566" y="315" class="body">枚举结束，一次交出 3072 个字符</text>
  <text x="28" y="338" class="body">used 逐行增加：3 → 6 → 9 → … → 3072</text>
  <path d="M28 358H872" stroke="#c7d6d7"/>

  <text x="28" y="390" class="label">计数位置</text>
  <text x="128" y="390" class="code">CsvHelper → StreamWriter.WriteAsync</text>
  <text x="28" y="420" class="body">目标流实测（此输入）：两版均收到 1 次写入，共 3072 字节，另有 2 次刷新。</text>
</svg>
